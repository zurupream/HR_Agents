    <script>
      (function () {
        try {
          var saved = localStorage.getItem('apple_reading_theme') || localStorage.getItem('theme') || 'sand';
          var valid = ['daylight', 'sand', 'dusk', 'midnight'];
          var theme = valid.indexOf(saved) !== -1 ? saved : 'sand';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dusk' || theme === 'midnight') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
